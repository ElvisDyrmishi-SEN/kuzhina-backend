<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | Kuzhina e Shefit</title>
    <link rel="icon" type="image/jpeg" href="ikon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      [hidden] {
        display: none !important;
      }

      body {
        background: var(--cream);
        min-height: 100vh;
      }

      .admin-header {
        background: var(--ink);
        padding: 16px 0;
      }

      .admin-header .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .admin-header .btn-outline {
        padding: 10px 20px;
        font-size: 0.75rem;
      }

      .admin-main {
        padding-top: 48px;
        padding-bottom: 80px;
      }

      .login-card {
        max-width: 400px;
        margin: 10vh auto 0;
        background: var(--paper);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        padding: 44px 36px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .login-card h1 {
        font-size: 2.2rem;
      }

      .login-card input {
        border: 1px solid var(--line);
        background: #fff;
      }

      .login-error {
        color: #c0392b;
        font-size: 0.9rem;
        min-height: 1.2em;
      }

      .admin-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }

      .admin-tab {
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-muted);
        background: var(--paper);
        border: 1px solid var(--line);
      }

      .admin-tab--active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--text-light);
      }

      .admin-tab .count {
        opacity: 0.6;
        margin-left: 4px;
      }

      .admin-list {
        display: grid;
        gap: 14px;
      }

      .admin-item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 20px 22px;
      }

      .admin-item-body {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .admin-item .stars {
        font-size: 0.95rem;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }

      .admin-item .stars .star-off {
        color: var(--line);
      }

      .admin-item-text {
        font-size: 1.05rem;
        margin-bottom: 8px;
      }

      .admin-item-meta {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .admin-item-meta strong {
        color: var(--text);
      }

      .btn-delete {
        flex-shrink: 0;
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #c0392b;
        border: 1px solid rgba(192, 57, 43, 0.35);
        transition: var(--transition);
      }

      .btn-delete:hover {
        background: #c0392b;
        color: #fff;
      }

      .admin-empty {
        text-align: center;
        color: var(--text-muted);
        padding: 48px 20px;
        border: 1px dashed var(--line);
        border-radius: var(--radius-sm);
      }

      /* Recipes */
      .recipe-form {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 32px;
        margin-bottom: 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .recipe-form h2 {
        font-size: 1.8rem;
      }

      .photo-picker {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 16 / 9;
        max-height: 300px;
        border: 2px dashed var(--line);
        border-radius: var(--radius-sm);
        background: var(--cream);
        color: var(--text-muted);
        font-weight: 600;
        cursor: pointer;
        overflow: hidden;
        transition: var(--transition);
      }

      .photo-picker:hover {
        border-color: var(--gold);
      }

      .photo-picker input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .photo-picker img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }

      .field--wide {
        grid-column: 1 / -1;
      }

      .recipe-form .field label {
        color: var(--text-muted);
      }

      .recipe-form input,
      .recipe-form select,
      .recipe-form textarea {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        outline: none;
        font-size: 0.97rem;
      }

      .recipe-form input:focus,
      .recipe-form select:focus,
      .recipe-form textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px var(--gold-soft);
      }

      .recipe-form .btn {
        align-self: flex-start;
      }

      .admin-item-thumb {
        width: 96px;
        height: 72px;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: 8px;
      }

      .admin-item--recipe {
        align-items: center;
      }

      .admin-item--recipe .admin-item-body {
        flex: 1;
      }

      @media (max-width: 600px) {
        .admin-item {
          flex-direction: column;
        }

        .admin-item--recipe {
          align-items: flex-start;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .recipe-form {
          padding: 24px 18px;
        }

        .admin-tabs {
          flex-wrap: wrap;
        }
      }
    </style>
    <script defer src="admin.js"></script>
  </head>
  <body>
    <header class="admin-header">
      <div class="container">
        <a href="/" class="brand">
          <img src="ikon.jpg" alt="" class="brand-img" />
          <span class="brand-text">
            <span class="brand-name">Kuzhina e Shefit</span>
            <span class="brand-sub">Admin</span>
          </span>
        </a>
        <button class="btn btn-outline hidden" id="logoutBtn">Dil</button>
      </div>
    </header>

    <main class="admin-main container">
      <!-- LOGIN -->
      <form class="login-card" id="loginForm">
        <p class="eyebrow">Paneli i Shefit</p>
        <h1>Hyr</h1>
        <div class="field">
          <label for="password">Fjalëkalimi</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <p class="login-error" id="loginError"></p>
        <button type="submit" class="btn btn-gold btn-block">Hyr</button>
      </form>

      <!-- DASHBOARD -->
      <section id="dashboard" hidden>
        <div class="admin-tabs">
          <button class="admin-tab admin-tab--active" data-view="reviews">
            Reviews <span class="count" id="reviewsCount"></span>
          </button>
          <button class="admin-tab" data-view="bookings">
            Rezervime <span class="count" id="bookingsCount"></span>
          </button>
          <button class="admin-tab" data-view="recipes">
            Receta <span class="count" id="recipesCount"></span>
          </button>
        </div>

        <!-- ADD RECIPE -->
        <form class="recipe-form" id="recipeForm" hidden>
          <h2>Shto recetë të re</h2>

          <label class="photo-picker" for="recipePhoto">
            <img id="photoPreview" alt="" hidden />
            <span id="photoHint">+ Zgjidh foton e pjatës</span>
            <input type="file" id="recipePhoto" accept="image/jpeg,image/png,image/webp" required />
          </label>

          <div class="form-grid">
            <div class="field field--wide">
              <label for="recipeTitle">Titulli i plotë</label>
              <input type="text" id="recipeTitle" maxlength="160" placeholder="p.sh. Risotto me Kërpudha Porcini" required />
            </div>
            <div class="field">
              <label for="recipeShort">Titulli i shkurtër</label>
              <input type="text" id="recipeShort" maxlength="60" placeholder="Shfaqet mbi foton e vogël" />
            </div>
            <div class="field">
              <label for="recipeCategory">Kategoria</label>
              <input type="text" id="recipeCategory" maxlength="60" placeholder="p.sh. Pjata Kryesore" />
            </div>
            <div class="field">
              <label for="recipeTime">Koha</label>
              <input type="text" id="recipeTime" maxlength="40" placeholder="p.sh. 35 min" />
            </div>
            <div class="field">
              <label for="recipeDifficulty">Vështirësia</label>
              <select id="recipeDifficulty">
                <option value="">—</option>
                <option>E lehtë</option>
                <option>Mesatare</option>
                <option>E lartë</option>
              </select>
            </div>
            <div class="field field--wide">
              <label for="recipeDescription">Përshkrimi</label>
              <textarea id="recipeDescription" rows="4" maxlength="2000" placeholder="Përbërësit dhe si përgatitet pjata…" required></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-gold">Shto recetën</button>
        </form>

        <div class="admin-list" id="list"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
